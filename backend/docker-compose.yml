services:
  postgres:
    image: postgres:16
    container_name: foodshare-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: foodshare
      POSTGRES_PASSWORD: foodshare
      POSTGRES_DB: foodshare
    ports:
      - '5433:5432'
    volumes:
      - foodshare_pgdata:/var/lib/postgresql/data

  minio:
    image: quay.io/minio/minio:latest
    container_name: foodshare-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: foodshare_admin
      MINIO_ROOT_PASSWORD: foodshare123
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - foodshare_miniodata:/data

volumes:
  foodshare_pgdata:
  foodshare_miniodata:
